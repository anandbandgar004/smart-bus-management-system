services:
  db:
    image: postgis/postgis:16-3.4
    container_name: busai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-busai_navigator}
      POSTGRES_USER: ${DB_USER:-busai_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-busai_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-busai_user} -d ${DB_NAME:-busai_navigator}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: busai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: busai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.development
      - DB_NAME=${DB_NAME:-busai_navigator}
      - DB_USER=${DB_USER:-busai_user}
      - DB_PASSWORD=${DB_PASSWORD:-busai_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - DELHI_GTFS_API_KEY=${DELHI_GTFS_API_KEY:-dXWwDivSMetvfYWVwOxX2oXnQnfHQOSA}
      - BUS_LIMIT=${BUS_LIMIT:-200}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: daphne -b 0.0.0.0 -p 8000 core.asgi:application

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: busai_celery_worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.development
      - DB_NAME=${DB_NAME:-busai_navigator}
      - DB_USER=${DB_USER:-busai_user}
      - DB_PASSWORD=${DB_PASSWORD:-busai_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - DELHI_GTFS_API_KEY=${DELHI_GTFS_API_KEY:-dXWwDivSMetvfYWVwOxX2oXnQnfHQOSA}
      - BUS_LIMIT=${BUS_LIMIT:-200}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core worker -l info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: busai_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.development
      - DB_NAME=${DB_NAME:-busai_navigator}
      - DB_USER=${DB_USER:-busai_user}
      - DB_PASSWORD=${DB_PASSWORD:-busai_password}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - DELHI_GTFS_API_KEY=${DELHI_GTFS_API_KEY:-dXWwDivSMetvfYWVwOxX2oXnQnfHQOSA}
      - BUS_LIMIT=${BUS_LIMIT:-200}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
