services:
  # ── Django Backend (Daphne ASGI Server) ──────────────────────────────
  - type: web
    name: busai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: busai-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set manually after frontend deploy
      - key: DATABASE_URL
        sync: false  # Set from Neon.tech connection string
      - key: REDIS_URL
        sync: false  # Set from Upstash connection string
      - key: DELHI_GTFS_API_KEY
        value: dXWwDivSMetvfYWVwOxX2oXnQnfHQOSA
      - key: BUS_LIMIT
        value: "200"
      - key: OPERATOR_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: SECURE_SSL_REDIRECT
        value: "False"  # Render handles SSL termination at proxy level
